# .air.toml configuration for live hot-reloading OpAMP server
root = "."
tmp_dir = "tmp"

[build]
# Build command targeting the main server binary
cmd = "go build -o ./tmp/opamp-server ./cmd/server"
# Binary to run after build
bin = "./tmp/opamp-server"
# CLI arguments to pass to the binary
args_bin = ["-port", "4320", "-mode", "development", "-config-dir", "./examples/configs"]
# Watch these extensions
include_ext = ["go", "html", "css", "js", "yaml", "yml"]
# Ignore watching these directories and files
exclude_dir = ["bin", "tmp", "vendor", "testdata", ".git"]
exclude_file = []
exclude_regex = ["_test\\.go$"]
# Delay after file change before rebuilding (ms)
delay = 500
# Stop previous process cleanly before starting new build
stop_on_error = true
# Send SIGINT signal when killing the running process
send_interrupt = true
kill_delay = 500

[log]
# Show air timestamp
time = true
# Show main log
main_only = false

[color]
# Customize colors
main = "magenta"
watcher = "cyan"
build = "yellow"
runner = "green"

[screen]
clear_on_rebuild = false
keep_scroll = true
